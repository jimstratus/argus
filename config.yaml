# Argus — multi-model code review skill
# Registry of reviewers, named profiles, and host-CLI adaptation rules.
#
# Routes:
#   aichat        — invoke via `aichat -m CLIENT:MODEL -S` with prompt piped to stdin.
#                   CLIENT must match an entry under `aichat_clients:` below and a
#                   corresponding client in ~/.config/aichat/config.yaml (generated by
#                   scripts/install_aichat.py).
#   gemini-cli    — invoke the Gemini CLI (uses your paid sub)
#   codex-cli     — invoke the Codex CLI (uses your paid sub)
#   claude-cli    — invoke the Claude CLI (auto-added when host != claude)
#   opencode-cli  — invoke the OpenCode CLI (uses your Go sub)
#
# Every reviewer: primary route + optional fallback.
# Fallbacks are attempted only when primary returns non-zero or times out.

version: 1

defaults:
  profile: standard
  # ───────────────────────────────────────────────────────────────────
  # Route preference — which provider a reviewer tries FIRST when it has
  # BOTH a direct-API route and an OpenRouter route (currently glm,
  # minimax, deepseek).
  #   openrouter  → OpenRouter first, direct API as fallback  (PUBLIC DEFAULT:
  #                 one OPENROUTER_API_KEY covers most reviewers)
  #   direct      → each provider's own API first, OpenRouter as fallback
  #                 (cheaper / your own subs; what you'd use if your OR
  #                 balance is depleted)
  # CLI reviewers (codex/claude/opencode/gemini) are NEVER reordered — their
  # CLI sub stays primary and OpenRouter stays a true fallback.
  # Override per-run with --prefer-direct / --prefer-openrouter / --route-pref,
  # or the ARGUS_ROUTE_PREF environment variable. Precedence:
  #   CLI flag  >  ARGUS_ROUTE_PREF  >  this config value.
  route_preference: openrouter
  privacy_mode: true              # exclude reviewers with privacy: LOGS
  allow_free: false               # require --allow-free to include free-tier routes
  allow_logging: false            # require --allow-logging to include privacy: LOGS
  confidence_threshold: 80        # drop findings with effective confidence < this
  corroboration_boost: 15         # confidence bonus when 2+ reviewers agree on same file:line
  merge_line_tolerance: 3         # cluster findings within +/- this many lines (merge.py)
  ctx_safety_ratio: 0.70          # skip reviewer if prompt_tokens > ctx * this
  reviewer_timeout_sec: 360       # bumped from 180 on 2026-05-06 after a 4-doc
                                  # ~80K-token bundle had 5/7 reviewers timeout.
                                  # 360s handles bundles up to ~150K tokens; for
                                  # larger bundles, callers should split or
                                  # raise per-call via --timeout in dispatch.py.
  max_parallel: 4                 # cap on concurrent reviewers within a single
                                  # dispatch.py invocation; also the recommended
                                  # cap on parallel subagents when the calling
                                  # agent fans out subagent-per-reviewer.
  review_cost_warn_usd: 0.50
  review_cost_block_usd: 2.00
  benchmark_cost_warn_usd: 10.00
  benchmark_cost_block_usd: 30.00
  daily_soft_cap_usd: 10.00
  default_output_tokens_est: 800
  prompt_overhead_tokens: 500
  # OR balance pre-flight: require available ≥ estimate × this factor.
  or_balance_safety_factor: 2.0

# ─────────────────────────────────────────────────────────────────────
# Reviewers
#
# Keys are VERSION-FREE (glm, kimi, qwen, ...). The model version lives in
# the `model:` slug and the `display:` string ONLY. This means a model bump
# is a one-line edit that never invalidates a saved profile, a --custom
# roster, or a history.db/benchmark row keyed by reviewer name.
#
# Old version-named keys (glm-5.2, kimi-k2.6, ...) still work — see the
# `aliases:` map below.
#
# The OPENROUTER-ROUTED pins in this block — every `client: openrouter`
# model slug, plus its ctx and cost_per_m — were verified against the live
# catalog (GET /api/v1/models) on 2026-09-22.
#
# NOT covered by that check, because the OpenRouter API cannot see them:
#   - direct-provider slugs (zai `glm-5.3`, minimax `MiniMax-M3`,
#     deepseek `deepseek-v4-pro`, nous `Hermes-4-405B`)
#   - CLI-provider slugs (`minimax-coding-plan/...`, `ollama-cloud/...`,
#     copilot's `gpt-5.3`)
# `opencode-glm` is the live example: it is deliberately still on
# glm-5.2 precisely because that catalog is not visible from here (see its
# entry below). Do not read this header as validating those routes.
#
# Two DIFFERENT checks, neither of which substitutes for the other:
#   reachability — does the route answer?
#       py -3.12 scripts/verify.py --all
#   catalog metadata — does the slug still exist, and are ctx / price current?
#       curl -s https://openrouter.ai/api/v1/models   (diff against the pins below)
# verify.py only pings; it cannot see the catalog. A reviewer can ping green
# on a stale ctx or an out-of-date price, so a clean `verify.py --all` is NOT
# evidence that these pins are current. (A `--refresh` subcommand to automate
# the catalog diff is a tracked v2 idea; until it exists, do the diff by hand.)
# ─────────────────────────────────────────────────────────────────────
reviewers:

  glm:
    display: "GLM-5.3 (Zhipu / z.ai — direct + OpenRouter dual route)"
    role: [security, logic, code]
    ctx: 1310720
    tier: paid
    privacy: ok
    cost_per_m: { input: 0.84, output: 2.64 }
    # Dual route. Declared order is direct-first; `defaults.route_preference`
    # (or --prefer-*) decides which is actually tried first at dispatch time.
    # The OpenRouter reasoning-only trap (content=null on large prompts via
    # Io Net) is mitigated by aichat_clients.openrouter.patch below.
    primary:  { route: aichat, client: zai,        model: "glm-5.3" }
    fallback: { route: aichat, client: openrouter, model: "z-ai/glm-5.3" }

  minimax:
    display: "MiniMax M3 (MiniMax — direct + OpenRouter dual route)"
    role: [style, correctness, agent]
    # Still the newest MiniMax flagship as of 2026-09-22 (M3, 2026-05-31).
    # ctx corrected 204800 -> 1048576: OpenRouter serves M3 at 1M, and the
    # old under-declared value was tripping ctx_safety_ratio skips on large
    # bundles that M3 could actually have handled.
    ctx: 1048576
    tier: paid
    privacy: ok
    cost_per_m: { input: 0.30, output: 1.20 }
    primary:  { route: aichat, client: minimax,    model: "MiniMax-M3" }
    fallback: { route: aichat, client: openrouter, model: "minimax/minimax-m3" }

  opencode-minimax:
    display: "MiniMax M3 via OpenCode (minimax coding plan)"
    role: [correctness, code, agent]
    ctx: 200000
    tier: paid
    privacy: ok
    custom_only: true
    cost_per_m: null   # opencode sub
    primary: { route: opencode-cli, model: "minimax-coding-plan/MiniMax-M3" }

  opencode-glm:
    display: "GLM-5.2 via OpenCode (Ollama Cloud)"
    role: [security, logic, code]
    ctx: 131072
    tier: paid
    privacy: ok
    custom_only: true
    cost_per_m: null   # opencode sub
    # NOT bumped to 5.3 with the rest: the Ollama Cloud catalog is not
    # visible from the OpenRouter models API, so `ollama-cloud/glm-5.3`
    # is unverified and this route has no fallback to absorb a bad slug.
    # Confirm with `opencode models | grep ollama-cloud/glm` then bump.
    primary: { route: opencode-cli, model: "ollama-cloud/glm-5.2" }

  kimi:
    display: "Kimi K3 (Moonshot — flagship; K2.7-Code as cheaper fallback)"
    role: [long-context, agent, code]
    ctx: 1048576
    tier: paid
    privacy: ok
    cost_per_m: { input: 3.00, output: 15.00 }
    # KIMI_API_KEY is for chat.kimi.com (consumer), not Moonshot Platform,
    # so both routes go through OpenRouter.
    # NOTE: K3 is ~5x the cost of the K2.5 this entry used to point at.
    # If a run trips the $2 review block, the fallback slug below is the
    # cost-sane swap (K2.7-Code, $0.71/$3.21, code-specialised).
    primary:  { route: aichat, client: openrouter, model: "moonshotai/kimi-k3" }
    fallback: { route: aichat, client: openrouter, model: "moonshotai/kimi-k2.7-code" }

  mimo:
    display: "Xiaomi MiMo-V2.6-Pro"
    role: [long-context, code]
    ctx: 1048576
    tier: paid
    privacy: ok
    # Was xiaomi/mimo-v2-pro — DELISTED from OpenRouter. That slug 404'd on
    # every dispatch, so this reviewer was silently dead until 2026-09-22.
    # v2.6-Pro is both newer and cheaper than the v2-Pro rates it replaces.
    cost_per_m: { input: 0.43, output: 0.87 }
    primary:  { route: aichat, client: openrouter, model: "xiaomi/mimo-v2.6-pro" }
    fallback: { route: aichat, client: openrouter, model: "xiaomi/mimo-v2.6-flash" }

  qwen:
    display: "Qwen3.8-Max (Alibaba)"
    role: [style, agent, code]
    ctx: 1000000
    tier: paid
    privacy: ok
    cost_per_m: { input: 2.00, output: 6.00 }
    # qwen3.8-max is the current flagship; qwen3.7-plus ($0.32/$1.28) is the
    # value-tier fallback and is what the old qwen-3.6-plus entry was closest
    # to on price.
    primary:  { route: aichat, client: openrouter, model: "qwen/qwen3.8-max-0902" }
    fallback: { route: aichat, client: openrouter, model: "qwen/qwen3.7-plus" }

  grok:
    display: "Grok 4.7 (xAI — current flagship, 500K ctx)"
    role: [reasoning, code]
    ctx: 500000
    tier: paid
    privacy: ok
    cost_per_m: { input: 1.60, output: 4.80 }
    primary:  { route: aichat, client: openrouter, model: "x-ai/grok-4.7" }

  grok-longctx:
    display: "Grok 4.20 (xAI — 2M ctx; the ONLY 2M-context reviewer)"
    role: [long-context, reasoning]
    ctx: 2000000
    tier: paid
    privacy: ok
    # NOT custom_only, deliberately: `grok-4.20` was a normal reviewer before
    # the version-free rename, and its alias resolves here. Gating this entry
    # would make a saved profile (--save-as) holding the legacy name silently
    # lose the reviewer — the alias would resolve and then the custom_only gate
    # would drop it, since profile resolution is non-explicit. It is absent
    # from every shipped profile, so nothing auto-includes it regardless.
    cost_per_m: { input: 1.25, output: 2.50 }
    # Deliberately NOT superseded by `grok`. Every newer Grok (4.3 -> 4.7)
    # drops to 500K-1M ctx; 4.20 is the only 2M window in the registry, which
    # is the entire reason this reviewer exists. Keep until something newer
    # matches the window. Name it via --custom/--models for huge bundles.
    primary:  { route: aichat, client: openrouter, model: "x-ai/grok-4.20" }

  # Superseded by `deepseek` (kept for benchmark-history continuity).
  # No longer in any default profile; name it via --custom/--models to use it.
  deepseek-v3.2:
    display: "DeepSeek V3.2 (legacy — superseded by `deepseek`)"
    role: [reasoning, security, code]
    ctx: 163840
    tier: paid
    privacy: ok
    custom_only: true
    cost_per_m: { input: 0.27, output: 0.40 }
    primary:  { route: aichat, client: openrouter, model: "deepseek/deepseek-v3.2" }

  deepseek:
    display: "DeepSeek V4 Pro 0813 (1M ctx — direct + OpenRouter dual route)"
    role: [reasoning, security, code, long-context]
    ctx: 1048576
    tier: paid
    privacy: ok
    cost_per_m: { input: 0.62, output: 2.88 }
    # Dual route: DeepSeek's own platform (api.deepseek.com) + OpenRouter.
    # `route_preference` / --prefer-* selects which is tried first.
    # The 0813 refresh is cheaper on input but ~1.5x on output vs the
    # original v4-pro snapshot, so long-output runs get slightly dearer.
    primary:  { route: aichat, client: deepseek,   model: "deepseek-v4-pro" }
    fallback: { route: aichat, client: openrouter, model: "deepseek/deepseek-v4-pro-0813" }

  # Custom-only — not included in any default profile. Available via --custom or --models.
  hermes:
    display: "Nous Hermes 4 405B"
    role: [style, reasoning]
    ctx: 131072
    tier: paid
    privacy: ok
    custom_only: true
    cost_per_m: { input: 1.00, output: 3.00 }
    # No newer Hermes exists — hermes-4-405b (2025-08-26) is still the latest
    # Nous release on OpenRouter as of 2026-09-22. The old display string
    # ("Hermes 4.3 36B") named a model that was never on any route here.
    # Direct route only fires when NOUSRESEARCH_API_KEY is set (it isn't in
    # this env), so the OR fallback is what actually runs.
    primary:  { route: aichat, client: nous,       model: "Hermes-4-405B" }
    fallback: { route: aichat, client: openrouter, model: "nousresearch/hermes-4-405b" }

  # Paid-CLI reviewers — no cost attached (use host subscription)
  gemini:
    display: "Gemini (Google CLI — ON HOLD — Windows .cmd shim doesn't tree-kill, hangs)"
    role: [frontier, long-context]
    ctx: 1048576
    tier: paid
    privacy: ok
    disabled: true      # on hold — run_subprocess now tree-kills on timeout; re-test on Windows before re-enabling (use gemini-or meanwhile)
    cost_per_m: null
    # gemini-3.1-pro-preview is still the newest *Pro*-tier Gemini on
    # OpenRouter (2026-02-19); the 3.6/3.7/3.8 releases are Flash-only.
    primary:  { route: gemini-cli }
    fallback: { route: aichat, client: openrouter, model: "google/gemini-3.1-pro-preview" }

  gemini-or:
    display: "Gemini 3.8 Flash via OpenRouter"
    role: [frontier, long-context]
    ctx: 1048576
    tier: paid
    privacy: ok
    cost_per_m: { input: 0.75, output: 3.75 }
    # Was google/gemini-2.5-flash. 3.8-flash is 2.5x the input cost but
    # three generations newer; 2.5-flash remains selectable via --custom
    # if the bench says the delta isn't worth it.
    primary:  { route: aichat, client: openrouter, model: "google/gemini-3.8-flash" }

  codex:
    display: "Codex CLI (OpenAI sub; GPT-5.3-Codex as OR fallback)"
    role: [frontier, reasoning, code]
    ctx: 400000
    tier: paid
    privacy: ok
    cost_per_m: null
    # Fallback tracks the newest *Codex*-branded model rather than the newest
    # OpenAI flagship (gpt-6-astra, $10/$50) — a fallback that costs 4x the
    # primary's $0 sub would blow the review cost gate on every CLI hiccup.
    primary:  { route: codex-cli }
    fallback: { route: aichat, client: openrouter, model: "openai/gpt-5.3-codex" }

  claude:
    display: "Claude via claude CLI"
    role: [frontier, reasoning]
    ctx: 1000000
    tier: paid
    privacy: ok
    cost_per_m: null
    # No OpenRouter fallback by design: this reviewer is auto-skipped inside
    # Claude Code (host_rules) and a metered fallback would be a new spend
    # path, not a model bump. Add one deliberately if you want it.
    primary: { route: claude-cli }

  opencode:
    display: "OpenCode (your Go sub)"
    role: [agent, code]
    ctx: 200000
    tier: paid
    privacy: ok
    cost_per_m: null
    primary: { route: opencode-cli }

  # ELIMINATED: Copilot CLI's agent harness returns prose instead of our JSON
  # schema, yielding F1=0 across all non-clean fixtures. Not a retry issue —
  # fundamental prompt/harness mismatch. Left here as a reference entry only.
  copilot:
    display: "GitHub Copilot CLI — ELIMINATED (harness returns prose not JSON)"
    role: [frontier, code]
    ctx: 128000
    tier: paid
    privacy: ok
    custom_only: true
    disabled: true
    cost_per_m: null
    primary: { route: copilot-cli, model: "gpt-5.3" }

# ─────────────────────────────────────────────────────────────────────
# Reviewer aliases — old name -> canonical reviewer key.
#
# Reviewer keys went version-free on 2026-09-22 so that model bumps stop
# breaking saved profiles and benchmark history. These aliases keep every
# previously-valid roster string working: --custom "glm-5.2,kimi-k2.6"
# resolves to --custom "glm,kimi".
#
# Resolution happens in _common.canonicalize_roster(), which is applied by
# resolve_roster (dispatch/benchmark), estimate_cost.py and verify.py.
#
# NOTE: `grok-4.20` maps to `grok-longctx`, NOT `grok`. The old key named the
# 2M-context model specifically, and `grok` is now Grok 4.7 at 500K — mapping
# it to `grok` would silently shrink the context window of an existing roster.
# ─────────────────────────────────────────────────────────────────────
aliases:
  # Pre-rename keys from the reference benchmark recorded in README.md and
  # docs/benchmarks.html. Without these, bench_cost.py marks those rows
  # `unknown`, drops them from the total, and exits 1 — i.e. this repo's own
  # documented historical run could not be costed. They price as `estimated`
  # (older model versions under the same reviewer slot), which is exactly the
  # weaker claim those rows warrant.
  glm-5.1:             glm
  minimax-m2.7:        minimax
  glm-5.2:             glm
  minimax-m3:          minimax
  kimi-k2.6:           kimi
  mimo-v2-pro:         mimo
  qwen-3.6-plus:       qwen
  grok-4.20:           grok-longctx
  deepseek-v4-pro:     deepseek
  hermes-4.3:          hermes
  opencode-minimax-m3: opencode-minimax
  opencode-glm-5.2:    opencode-glm
  copilot-gpt5:        copilot

# ─────────────────────────────────────────────────────────────────────
# Named profiles
# ─────────────────────────────────────────────────────────────────────
profiles:
  quick:
    description: "2-reviewer smoke test"
    members: [glm, gemini-or]
  standard:
    description: "Balanced everyday review — your favorites + paid CLIs + fast Gemini"
    members: [glm, minimax, gemini-or, codex]
  panel:
    description: "Maximum coverage (host CLI auto-skipped; copilot, gemini-direct, grok-longctx not in default)"
    members: [glm, minimax, kimi, mimo, qwen, deepseek, grok, gemini-or, codex, claude, opencode]
  security:
    description: "Auth / crypto / input-handling changes"
    members: [glm, deepseek, codex, claude]
    prompt_overlay: security
  deep:
    description: "Long-context, large diffs, cross-file correctness (add grok-longctx via --custom if a 2M window is needed)"
    members: [mimo, gemini-or, kimi, deepseek, codex]
    prompt_overlay: deep
  favorites:
    description: "Your picks (GLM + MiniMax direct subs)"
    members: [glm, minimax]
  direct:
    description: "Direct-API subs only, no Gemini — pair with route_preference=direct (or --prefer-direct) when your OpenRouter balance is depleted"
    members: [glm, minimax, deepseek, codex, claude, opencode]
  leaderboard-top5:
    description: "Post-bench top-5 by F1 — STALE: scored against the pre-2026-09-22 model set, re-run --benchmark before trusting it"
    members: [opencode, qwen, glm, gemini-or, minimax]

# ─────────────────────────────────────────────────────────────────────
# Host-CLI adaptation
# When Argus detects it's running inside one of these CLIs, the matching
# reviewer is removed from the roster and (optionally) another is added.
# ─────────────────────────────────────────────────────────────────────
host_rules:
  claude:   { skip: [claude],   add: [] }
  codex:    { skip: [codex],    add: [claude] }
  gemini:   { skip: [gemini],   add: [claude] }
  opencode: { skip: [opencode], add: [claude] }
  unknown:  { skip: [],         add: [] }

# ─────────────────────────────────────────────────────────────────────
# aichat client definitions — materialized into ~/.config/aichat/config.yaml
# by scripts/install_aichat.py. API keys NEVER written to disk; passed via
# subprocess env as AICHAT_<CLIENT>_API_KEY from the source env vars listed.
# ─────────────────────────────────────────────────────────────────────
aichat_clients:
  openrouter:
    type: openai-compatible
    api_base: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    # Suppress reasoning field (we just want content) and route away from
    # providers that return reasoning-only with content: null on large prompts.
    # Confirmed: aichat 0.30 honors `patch.chat_completions` body merges.
    patch:
      chat_completions:
        ".*":
          body:
            # Exclude the reasoning field from responses entirely.
            reasoning:
              exclude: true
              # Cap the provider's internal reasoning budget. Without this,
              # reasoning models (z-ai/glm-5.3, minimax/minimax-m3) can
              # spend 3+ minutes thinking on a 30K-token diff even when we
              # don't want to see the thoughts. 2000 tokens ≈ 30-60s budget.
              max_tokens: 2000
            # Route away from known reasoning-only providers that return
            # content=null when reasoning is trimmed or budget-capped.
            provider:
              ignore: ["io.net", "together.ai"]
  zai:
    type: openai-compatible
    api_base: https://api.z.ai/api/coding/paas/v4   # Coding Plan endpoint (your sub); standard /paas/v4 requires separate billing
    api_key_env: ZAI_API_KEY
  minimax:
    type: openai-compatible
    api_base: https://api.minimaxi.chat/v1
    api_key_env: MINIMAX_API_KEY
  deepseek:
    type: openai-compatible
    api_base: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  moonshot:
    type: openai-compatible
    api_base: https://api.moonshot.ai/v1
    api_key_env: KIMI_API_KEY                 # also accepts MOONSHOT_API_KEY
  nous:
    type: openai-compatible
    api_base: https://inference-api.nousresearch.com/v1
    api_key_env: NOUSRESEARCH_API_KEY

# ─────────────────────────────────────────────────────────────────────
# CLI invocation templates
# {client} and {model} are substituted for aichat; others take prompt on stdin.
# ─────────────────────────────────────────────────────────────────────
cli_commands:
  aichat:       ["aichat", "-m", "{client}:{model}", "-S"]   # prompt via stdin
  gemini-cli:   ["gemini", "--yolo", "-p", ""]               # prompt via STDIN (empty -p forces non-interactive; Windows ARG_MAX broke {prompt} for >32KB diffs, fixed 2026-05-06)
  codex-cli:    ["codex", "exec", "--skip-git-repo-check", "-"]   # stdin input; skip git-repo trust check
  claude-cli:   ["claude", "-p", "--output-format", "text", "--bare"]   # stdin
  opencode-cli: ["opencode", "run", "-"]                     # stdin input
  copilot-cli:  ["copilot", "-p", "Follow the review instructions provided on stdin.",
                 "--model", "{model}", "--allow-all-tools", "--no-color",
                 "--output-format", "text"]                  # prompt via STDIN (Windows ARG_MAX; same fix as gemini-cli)
